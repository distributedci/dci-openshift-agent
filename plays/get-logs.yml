---
- name: Setup job_logs directory
  ansible.builtin.include_tasks: log-dir.yml
  when: job_logs is undefined

- name: "Find the scripts directory"
  ansible.builtin.find:
    paths:
      - "{{ playbook_dir }}"
      - "{{ playbook_dir }}/.."
    file_type: directory
    patterns: "scripts"
    recurse: true
  register: scripts_dir

- name: "Get logs from IPI/UPI deployment"
  vars:
    provisioner_user: "{{ hostvars[groups['provisioner'][0]]['ansible_user'] }}"
    provisioner_host: >-
      {{ hostvars[groups.provisioner.0].ansible_host |
        default(groups['provisioner'][0]) }}
  ansible.builtin.shell:
    cmd: >
      {{ scripts_dir.files[0].path }}/get-ipi-logs
      {{ provisioner_user }}@{{ provisioner_host }}
      {{ job_logs.path }}
      {{ groups['masters'] | union(groups['workers']) | join(' ') }}
  ignore_errors: true
  when:
    - (install_type | default('ipi')) in ['ipi', 'upi']

- name: Get logs from ABI deployment
  ansible.builtin.include_tasks: abi-get-logs.yml
  when: (install_type | default('ipi')) in ['abi']

- name: Check if the target cluster API is reachable
  ansible.builtin.command:
    cmd: >
      timeout 10
      {{ oc_tool_path | default('oc') }}
      get --raw=/readyz
  environment:
    PATH: "{{ ansible_env.PATH }}:{{ dci_cluster_configs_dir }}:/sbin:/usr/sbin:/usr/local/bin/"
  register: _cluster_api_readyz
  failed_when: false
  changed_when: false
  delegate_to: jumphost

- name: Collect logs that require the target cluster API
  when:
    - _cluster_api_readyz.rc == 0
  delegate_to: jumphost
  vars:
    _mg_is_type: "{{ (ocp_version | default(version)) is version('4.14', '>') | ternary('idms', 'icsp') }}"
    _mg_hints: "{{ dci_must_gather_images | default([]) | reject('search', '/') | list }}"
    _mg_full: "{{ dci_must_gather_images | default([]) | select('search', '/') | list }}"
    _hub_mg_hints: "{{ dci_hub_must_gather_images | default([]) | reject('search', '/') | list }}"
    _hub_mg_full: "{{ dci_hub_must_gather_images | default([]) | select('search', '/') | list }}"
    _mg_mirror_images: "{{ (_mg_full + ((enable_acm | default(false) | bool) | ternary(_hub_mg_full, []))) | unique | list }}"
  block:
    - name: "Gathering results for storage service tester"
      ansible.builtin.include_role:
        name: redhatci.ocp.storage_tester
        tasks_from: gathering-logs.yml
        apply:
          environment:
            REGISTRY: "{% if dci_local_registry is defined %}{{ dci_local_registry }}{% else %}registry.redhat.io{% endif %}"
            OC_PATH: "{{ oc_tool_path }}"
      when:
        - dci_main is defined
        - dci_main == 'upgrade'
        - storage_upgrade_tester | default(false) | bool

    - name: Collect hardware data
      ansible.builtin.include_role:
        name: redhatci.ocp.node_info
      vars:
        ni_oc_tool_path: "{{ oc_tool_path }}"
        ni_job_logs_path: "{{ job_logs.path }}"
        ni_disconnected: "{{ dci_disconnected | default(false) }}"
        ni_local_registry: "{{ dci_local_registry }}"
        ni_local_img_path: "{{ dci_hardware_img_path | default('/dci/lshw') }}"
        ni_pullsecret_file: "{{ dci_pullsecret_file | default('') }}"
        ni_tag: "{{ dci_hardware_tag | default('latest') }}"
      when:
        - dci_collect_hardware | default(true) | bool

    - name: Reset resolved must-gather images
      ansible.builtin.set_fact:
        rmgi_resolved_images: []

    - name: Resolve must-gather short names to full image references
      ansible.builtin.include_role:
        name: redhatci.ocp.resolve_must_gather_images
      vars:
        rmgi_images: "{{ _mg_hints }}"
      when:
        - _mg_hints | length > 0

    - name: Set must-gather images
      ansible.builtin.set_fact:
        mi_mg_images: "{{ (_mg_full + rmgi_resolved_images) | flatten | unique | list }}"

    - name: Reset resolved must-gather images for Hub
      ansible.builtin.set_fact:
        rmgi_resolved_images: []
      when:
        - enable_acm | bool

    - name: Resolve Hub must-gather short names to full image references
      ansible.builtin.include_role:
        name: redhatci.ocp.resolve_must_gather_images
      vars:
        rmgi_images: "{{ _hub_mg_hints }}"
      when:
        - enable_acm | bool
        - _hub_mg_hints | length > 0

    - name: Append Hub must-gather images
      ansible.builtin.set_fact:
        mi_mg_images: "{{ (mi_mg_images | default([]) + _hub_mg_full + rmgi_resolved_images) | flatten | unique | list }}"
      when:
        - enable_acm | bool

    - name: Debug target must-gather images
      ansible.builtin.debug:
        msg: "{{ mi_mg_images }}"

    # Best effort to mirror explicit full must-gather refs. Short-name hints
    # are resolved from CSVs and are expected to be reachable already.
    - name: "Mirror must-gather images"
      ansible.builtin.include_role:
        name: redhatci.ocp.mirror_images
        apply:
          ignore_errors: true
      vars:
        mi_images: "{{ _mg_mirror_images }}"
        mi_authfile: "{{ dci_pullsecret_file }}"
        mi_registry: "{{ dci_local_registry }}"
        mi_is_type: "{{ _mg_is_type }}"
      when:
        - _mg_mirror_images | length > 0
        - dci_local_registry is defined
        - dci_local_registry not in ['', ':']

    - name: Apply Image Source manifest
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('ansible.builtin.file', mi_is_file.path) | from_yaml_all | list }}"
      register: _mg_is_apply
      ignore_errors: true
      when:
        - mi_is_file is defined
        - mi_is_file.path is defined
        - acm_cluster_type | default('') not in ['HostedControlPlane']

    - name: Wait for IDMS to roll out
      ansible.builtin.include_role:
        name: redhatci.ocp.check_resource
      vars:
        resource_to_check: "MachineConfigPool"
        check_wait_retries: 120
        check_wait_delay: 10
      ignore_errors: true
      when:
        - _mg_is_type == 'idms'
        - _mg_is_apply is changed
        - acm_cluster_type | default('') not in ['HostedControlPlane']

    - name: Remove temporary Image Source file
      ansible.builtin.file:
        path: "{{ mi_is_file.path }}"
        state: absent
      when:
        - mi_is_file is defined
        - mi_is_file.path is defined

    - name: Clear Image Source file fact
      ansible.builtin.set_fact:
        mi_is_file: {}

    - name: "Get logs from OCP deployment"
      environment:
        DCI_MUST_GATHER_IMAGES: "{{ mi_mg_images | join(' ') }}"
        DCI_MUST_GATHER_SINCE_TIME: "{{ job_info.job.created_at }}"
        PATH: "{{ ansible_env.PATH }}:{{ dci_cluster_configs_dir }}:/sbin:/usr/sbin:/usr/local/bin/"
      ansible.builtin.shell:
        cmd: >
          timeout -v 20m
          {{ scripts_dir.files[0].path }}/get-ocp-logs
          {% if (install_type | default('ipi')) == 'acm' %}
          -p {{ acm_cluster_type }}
          {% endif %}
          {{ job_logs.path }}
      ignore_errors: true

    - name: "Remove the must-gather directory"
      vars:
        dir_prefix: "{{ acm_cluster_type | default('', True) }}"
        dir_name: "{{ ((install_type | default('ipi')) == 'acm') | ternary(dir_prefix+'_must_gather', 'must_gather') }}"
      ansible.builtin.file:
        path: "{{ job_logs.path }}/{{ dir_name }}"
        state: absent

    - name: Generate SOS reports
      ansible.builtin.include_role:
        name: redhatci.ocp.sos_report
      vars:
        sos_report_image: "{{ support_tools_image }}"
        sos_report_nodes: "{{ dci_sos_report_nodes }}"
        sos_report_dir: "{{ job_logs.path }}"
        sos_report_oc_path: "{{ oc_tool_path }}"
      when:
        - dci_sos_report_nodes is defined
        - dci_sos_report_nodes | length

- name: Get logs from ACM-Hub
  when:
    - (install_type | default('ipi')) in ['acm']
  delegate_to: jumphost
  ignore_errors: true
  vars:
    _hub_mg_hints: "{{ dci_hub_must_gather_images | default([]) | reject('search', '/') | list }}"
    _hub_mg_full: "{{ dci_hub_must_gather_images | default([]) | select('search', '/') | list }}"
    _hub_mg_is_type: idms
  block:

    - name: Reset resolved must-gather images
      ansible.builtin.set_fact:
        rmgi_resolved_images: []

    - name: Resolve Hub must-gather short names to full image references
      ansible.builtin.include_role:
        name: redhatci.ocp.resolve_must_gather_images
        apply:
          environment:
            KUBECONFIG: "{{ hub_kubeconfig_path }}"
      vars:
        rmgi_images: "{{ _hub_mg_hints }}"
      when:
        - _hub_mg_hints | length > 0
        - hub_kubeconfig_path is defined

    - name: Set Hub must-gather images
      ansible.builtin.set_fact:
        hub_mg_images: "{{ (_hub_mg_full + rmgi_resolved_images) | flatten | unique | list }}"

    - name: Debug Hub must-gather images
      ansible.builtin.debug:
        msg: "{{ hub_mg_images }}"

    # Best effort to mirror explicit full must-gather refs. Short-name hints
    # are resolved from CSVs and are expected to be reachable already.
    - name: "Mirror Hub must-gather images"
      ansible.builtin.include_role:
        name: redhatci.ocp.mirror_images
        apply:
          ignore_errors: true
      vars:
        mi_images: "{{ _hub_mg_full }}"
        mi_authfile: "{{ dci_pullsecret_file }}"
        mi_registry: "{{ dci_local_registry }}"
        mi_is_type: "{{ _hub_mg_is_type }}"
      when:
        - _hub_mg_full | length > 0
        - dci_local_registry is defined
        - dci_local_registry not in ['', ':']

    - name: Apply Hub Image Source manifest
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ hub_kubeconfig_path }}"
        definition: "{{ lookup('ansible.builtin.file', mi_is_file.path) | from_yaml_all | list }}"
      register: _hub_is_apply
      ignore_errors: true
      when:
        - mi_is_file is defined
        - mi_is_file.path is defined

    - name: Wait for Hub IDMS to roll out
      ansible.builtin.include_role:
        name: redhatci.ocp.check_resource
        apply:
          environment:
            KUBECONFIG: "{{ hub_kubeconfig_path }}"
      vars:
        resource_to_check: "MachineConfigPool"
        check_wait_retries: 120
        check_wait_delay: 10
      ignore_errors: true
      when: _hub_is_apply is changed

    - name: Remove temporary Hub Image Source file
      ansible.builtin.file:
        path: "{{ mi_is_file.path }}"
        state: absent
      when:
        - mi_is_file is defined
        - mi_is_file.path is defined

    - name: Clear Hub Image Source file fact
      ansible.builtin.set_fact:
        mi_is_file: {}

    - name: "Get logs from ACM-Hub"
      environment:
        DCI_MUST_GATHER_IMAGES: "{{ hub_mg_images | join(' ') }}"
        DCI_MUST_GATHER_SINCE_TIME: "{{ job_info.job.created_at }}"
        KUBECONFIG: "{{ hub_kubeconfig_path }}"
        PATH: "{{ ansible_env.PATH }}:/sbin:/usr/sbin:/usr/local/bin/"
        REGISTRY: "{{ dci_local_registry }}"
      ansible.builtin.shell:
        cmd: >
          timeout -v 20m
          {{ scripts_dir.files[0].path }}/get-ocp-logs
          {{ job_logs.path }}
      ignore_errors: true

- name: Get the differences from the previous DCI job
  ansible.builtin.shell: "dci-diff-jobs --job_id_1 {{ job_id }} > {{ job_logs.path }}/diff-jobs.txt"
  ignore_errors: true
  delegate_to: localhost

- name: Find test Junit files
  ansible.builtin.find:
    paths: "{{ job_logs.path }}"
    recurse: true
    patterns: "*.xml"
  register: junit_matched

- name: "Upload Junit files"
  vars:
    mime_type: "application/junit"
    remove_ext: true
  ansible.builtin.include_tasks: upload-log.yml
  with_items: "{{ junit_matched.files }}"

- name: Find console logs
  ansible.builtin.find:
    paths: "/var/consoles/{{ cluster }}/"
    patterns: '{{ cluster }}*'
    size: 1k
    recurse: false
  register: console_log_files

- name: Copy console logs into tmp directory
  ansible.builtin.fetch:
    src: "{{ item }}"
    dest: "{{ job_logs.path }}/{{ item | basename }}-console.log"
    flat: true
    validate_checksum: false
  loop: "{{ console_log_files.files | map(attribute='path') | list }}"

- name: Find deployment logs (text)
  ansible.builtin.find:
    paths: "{{ job_logs.path }}"
    patterns: "*.log,*.txt,*.html,*.yaml,*.trace,*.pcap"
  register: logs_matched

- name: "Upload text logs"
  vars:
    mime_type: "text/plain"
  ansible.builtin.include_tasks: upload-log.yml
  when: not (item.path | regex_search(".*_sig-storage.*"))
  with_items: "{{ logs_matched.files }}"

- name: Find JSON files
  ansible.builtin.find:
    paths: "{{ job_logs.path }}"
    patterns: "*.json"
  register: json_matched

- name: "Upload JSON files"
  vars:
    mime_type: "application/json"
  ansible.builtin.include_tasks: upload-log.yml
  with_items: "{{ json_matched.files }}"

- name: Find deployment logs (compressed)
  ansible.builtin.find:
    paths: "{{ job_logs.path }}"
    recurse: true
    patterns: "*.gz"
  register: logs_matched

- name: "Upload compressed logs"
  vars:
    mime_type: "application/x-gzip"
  ansible.builtin.include_tasks: upload-log.yml
  with_items: "{{ logs_matched.files }}"

- name: Find SOS reports (compressed)
  ansible.builtin.find:
    paths: "{{ job_logs.path }}"
    recurse: true
    patterns: "*.tar.xz"
  register: logs_matched

- name: Upload more compressed logs
  vars:
    mime_type: "application/x-xz"
  ansible.builtin.include_tasks: upload-log.yml
  with_items: "{{ logs_matched.files }}"

- name: Clean up Temp dir
  ansible.builtin.file:
    path: "{{ job_logs.path }}"
    state: absent
