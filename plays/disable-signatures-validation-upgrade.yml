---
- name: Apply insecure policy MachineConfigs on cluster (upgrade)
  vars:
    _insecure_policy_source: >-
      data:text/plain;base64,
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: machineconfiguration.openshift.io/v1
      kind: MachineConfig
      metadata:
        labels:
          machineconfiguration.openshift.io/role: "{{ item.role }}"
        name: "99-{{ item.role }}-insecure-policy"
      spec:
        config:
          ignition:
            version: 3.2.0
          storage:
            files:
              - contents:
                  source: "{{ _insecure_policy_source }}"
                mode: 420
                overwrite: true
                path: /etc/containers/policy.json
  loop:
    - { role: master }
    - { role: worker }
  loop_control:
    label: "{{ item.role }}"
  register: _sig_policy_mc

- name: Wait for signature policy MachineConfigs to roll out
  when: _sig_policy_mc.changed  # noqa: no-handler
  ansible.builtin.include_role:
    name: redhatci.ocp.check_resource
  vars:
    resource_to_check: "MachineConfigPool"
    check_wait_retries: "{{ 16 * (dci_control_plane_size + dci_compute_size) | int + 1 }}"
    check_wait_delay: 30
