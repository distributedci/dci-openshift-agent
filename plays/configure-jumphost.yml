---
- name: Install helper tools
  vars:
    python_version: >-
      {{ (ansible_python.version.major == 3)
      | ansible.builtin.ternary('python3', 'python') }}
  become: true
  ansible.builtin.package:
    name:
      - "{{ python_version }}-firewall"
      - "{{ python_version }}-dns"
      - "{{ python_version }}-netaddr"
      - "jq"
      - "expect"
      - python3-passlib  # Comes from EPEL, required in redhatci.ocp/oc_setup
      - openssl
    state: installed

- name: Install libraries required by some old openshift installer binaries
  become: true
  ansible.builtin.package:
    name:
      - libvirt-libs
    state: installed

- name: Ensure ~/.local/bin exists for uv binary installation
  ansible.builtin.file:
    state: directory
    path: "{{ ansible_env.HOME }}/.local/bin"
    mode: "0755"

- name: Install uv binary
  vars:
    uv_ver: "{{ uv_version | default('0.12.15') }}"
  ansible.builtin.unarchive:
    src: "https://github.com/astral-sh/uv/releases/download/{{ uv_ver }}/uv-x86_64-unknown-linux-gnu.tar.gz"
    dest: "{{ ansible_env.HOME }}/.local/bin"
    mode: "0755"
    remote_src: true
    extra_opts:
      - uv-x86_64-unknown-linux-gnu/uv
      - --strip-components=1
  register: _uv_install
  retries: 5
  delay: 5
  until: _uv_install is not failed

# RHEL 10 does not ship python3-kubernetes.
- name: Install the kubernetes Python library on RHEL 10
  when:
    - ansible_distribution == 'RedHat'
    - ansible_distribution_major_version | int == 10
  block:
    - name: Check whether Ansible's Python can import kubernetes
      ansible.builtin.command:
        argv:
          - "{{ ansible_python.executable }}"
          - -c
          - import kubernetes
      register: _kubernetes_import
      changed_when: false
      failed_when: false

    - name: Install the kubernetes Python library with uv
      become: true
      ansible.builtin.command:
        argv:
          - "{{ ansible_env.HOME }}/.local/bin/uv"
          - pip
          - install
          - --python
          - "{{ ansible_python.executable }}"
          - --break-system-packages
          - kubernetes
      when: _kubernetes_import.rc != 0
      register: _kubernetes_uv_install
      retries: 5
      delay: 5
      until: _kubernetes_uv_install is not failed

- name: "Log out of podman registries"
  containers.podman.podman_logout:
    all: true
  failed_when: false

- name: Ensure DCI cache directory is present
  ansible.builtin.file:
    path: "{{ dci_cache_dir }}"
    state: directory
    owner: "{{ ansible_user_uid }}"
    group: "{{ ansible_user_gid }}"
    mode: "0750"
  become: true

- name: Ensure tmp directory exists
  ansible.builtin.file:
    state: directory
    path: "{{ ansible_env.HOME }}/tmp"
    mode: "0750"

- name: "Set roles_path"
  ansible.builtin.set_fact:
    roles_path: "{{ lookup('ansible.builtin.config', 'DEFAULT_ROLES_PATH') }}"

- name: Cluster config directory
  when:
    - dci_main == 'install'
  block:
    - name: "Clean up {{ dci_cluster_configs_dir }}"
      ansible.builtin.file:
        path: "{{ dci_cluster_configs_dir }}"
        state: absent

    - name: "Create {{ dci_cluster_configs_dir }}"
      ansible.builtin.file:
        path: "{{ dci_cluster_configs_dir }}"
        state: directory
        mode: "0755"

- name: Download stable openshift clients
  ansible.builtin.include_role:
    name: redhatci.ocp.ocp_tools
  vars:
    ot_tools:
      - oc
      - opm
    ot_dest: "{{ dci_cluster_configs_dir }}"
    ot_major: "{{ version.split('.')[0] }}"

- name: Move opm to the expected location
  ansible.builtin.copy:
    src: "{{ ot_bin.opm }}"
    dest: "{{ opm_tool_path }}"
    remote_src: true
    mode: "0755"
  when: ot_bin.opm != opm_tool_path

- name: Remove the versioned opm binary
  ansible.builtin.file:
    path: "{{ ot_bin.opm }}"
    state: absent
  when: ot_bin.opm != opm_tool_path

- name: Setup podman on the jumphost
  ansible.builtin.include_role:
    name: ansible-role-dci-podman
...
