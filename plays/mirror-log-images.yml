---
- name: Mirror and apply log collection images
  when:
    - dci_disconnected | default(false) | bool
    - dci_local_registry is defined
    - dci_local_registry | length > 0
  vars:
    _mli_maj: "{{ ocp_version_maj | default(version.split('.')[0]) }}"
    _mli_min: "{{ ocp_version_min | default(version.split('.')[1]) }}"
    # ICSP for OCP <= 4.14, IDMS for > 4.14
    _mli_is_type: >-
      {{
        ((_mli_maj ~ '.' ~ _mli_min) is version('4.14', '<=')) |
        ternary('icsp', 'idms')
      }}
    _mli_candidates: >-
      {{
        (
          [must_gather_image] +
          (dci_must_gather_images | default([])) +
          [support_tools_image]
        ) | unique | list
      }}
  delegate_to: jumphost
  block:
    - name: Mirror must-gather and support-tools images
      ansible.builtin.include_role:
        name: redhatci.ocp.mirror_images
        apply:
          delegate_to: jumphost
      vars:
        mi_images: "{{ _mli_candidates }}"
        mi_authfile: "{{ dci_pullsecret_file }}"
        mi_registry: "{{ dci_local_registry }}"
        mi_is_type: "{{ _mli_is_type }}"
      when:
        - _mli_candidates | length > 0

    - name: Apply log collection Image Source manifest
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('ansible.builtin.file', mi_is_file.path) | from_yaml_all | list }}"
      when:
        - _mli_candidates | length > 0
        - mi_is_file is defined
        - mi_is_file.path is defined

    - name: Wait for Image Source to roll out
      ansible.builtin.include_role:
        name: redhatci.ocp.check_resource
        apply:
          delegate_to: jumphost
      vars:
        resource_to_check: "MachineConfigPool"
        check_wait_retries: 120
        check_wait_delay: 10
      when:
        - _mli_candidates | length > 0
        - mi_is_file is defined
        - mi_is_file.path is defined

    - name: Remove temporary log collection Image Source file
      ansible.builtin.file:
        path: "{{ mi_is_file.path }}"
        state: absent
      when:
        - _mli_candidates | length > 0
        - mi_is_file is defined
        - mi_is_file.path is defined
