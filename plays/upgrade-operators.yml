---
- name: "Get current subscriptions"
  kubernetes.core.k8s_info:
    api: operators.coreos.com/v1alpha1
    kind: Subscription
  register: current_subscriptions
  retries: 5
  delay: 5

- name: "Get Operator's subscription Details"
  vars:
    subs_details: >
      resources[*].{ subscriptionName: metadata.name,
        operatorName: spec.name,
        namespace: metadata.namespace,
        installedCSV: status.installedCSV,
        catalogSource: spec.source,
        installPlanApproval: spec.installPlanApproval
      }
  ansible.builtin.set_fact:
    subscriptions: "{{ current_subscriptions | json_query(subs_details) }}"
  retries: 5
  delay: 5

- name: "Skip operators to be upgraded"
  ansible.builtin.set_fact:
    subscriptions: "{{ subscriptions | reject('search', item) | list }}"
  loop: "{{ operator_skip_upgrade }}"
  when:
    - operator_skip_upgrade | default([]) | length

- name: "Change install plans to manual"
  kubernetes.core.k8s:
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: "{{ sub.subscriptionName }}"
        namespace: "{{ sub.namespace }}"
      spec:
        name: "{{ sub.operatorName }}"
        installPlanApproval: "Manual"
  loop: "{{ subscriptions }}"
  loop_control:
    loop_var: sub
    label: "{{ sub.subscriptionName }}"

- name: "Set upgrade catalog source image"
  ansible.builtin.set_fact:
    dci_prune_index: "{{ prega_catalog_image }}"
  when:
    - prega_catalog_image is defined
    - dci_disconnected | default(false) | bool

- name: "Update disconnected catalogSources"
  ansible.builtin.include_role:
    name: redhatci.ocp.catalog_source
  vars:
    cs_name: "{{ opm_catalog_source_name }}"
    cs_namespace: "{{ opm_catalog_source_namespace }}"
    cs_image: "{{ dci_prune_index }}"
  when:
    - dci_disconnected | default(false) | bool
    - update_catalog_channel | default(true) | bool
    - mirror_list is defined
    - mirror_list | length
    - dci_prune_index is defined

- name: "Override redhat-operators with the pre-GA index"
  when:
    - not dci_disconnected | default(false) | bool
    - prega_catalog_image is defined
  block:
    - name: "Read the OperatorHub configuration"
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: OperatorHub
        name: cluster
      register: operatorhub

    - name: "Disable the default redhat-operators catalog"
      vars:
        hub_spec: "{{ operatorhub.resources[0].spec | default({}) }}"
        kept_sources: >-
          {{
            hub_spec.sources | default([])
            | rejectattr('name', 'equalto', 'redhat-operators')
            | list
          }}
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: config.openshift.io/v1
          kind: OperatorHub
          metadata:
            name: cluster
          spec: >-
            {{
              hub_spec | combine({
                'sources': kept_sources + [{'name': 'redhat-operators', 'disabled': true}]
              })
            }}

    - name: "Wait for marketplace to drop the managed redhat-operators catalog"
      vars:
        managed_query: >-
          resources[?metadata.annotations."operatorframework.io/managed-by"==`marketplace-operator`]
      kubernetes.core.k8s_info:
        api: operators.coreos.com/v1alpha1
        kind: CatalogSource
        name: redhat-operators
        namespace: openshift-marketplace
      register: rh_catsrc
      until:
        - (rh_catsrc | json_query(managed_query) | default([])) | length == 0
      retries: 30
      delay: 10

    - name: "Re-create redhat-operators pointing to the pre-GA index"
      ansible.builtin.include_role:
        name: redhatci.ocp.catalog_source
      vars:
        cs_name: redhat-operators
        cs_namespace: openshift-marketplace
        cs_image: "{{ prega_catalog_image }}"
        cs_publisher: Red Hat

- name: "Upgrade-operators : Upgrade installed operators"
  ansible.builtin.include_tasks: upgrade-csv.yml
  when:
    - sub is defined
    - sub | length
  loop: "{{ subscriptions }}"
  loop_control:
    loop_var: sub
    label: "{{ sub.subscriptionName }}"
...
