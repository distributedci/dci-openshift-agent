---
- name: "Run the Red Hat Test Suites"
  vars:
    ts_e2e_image: "quay.io/openshift/origin-tests"
    ts_registry: "{{ dci_local_registry }}"
    ts_registry_auth: "{{ dci_pullsecret_file }}"
    ts_ocp_version_maj: "{{ ocp_version_maj | int }}"
    ts_ocp_version_min: "{{ ocp_version_min | int }}"
    ts_registry_certificate: "{{ registry_certificate }}"
    ts_conformance_tests: "{{ dci_openshift_agent_conformance }}"
    ts_configs_dir: "{{ dci_cluster_configs_dir }}"
    ts_csi_tests_dir: "{{ dci_cluster_tests_dir }}"
    ts_csi_test_manifest: "{{ dci_openshift_csi_test_manifest }}"
    ts_do_cni_tests: "{{ dci_do_cni_tests }}"
    ts_do_virt_tests: "{{ dci_do_virt_tests }}"
  ansible.builtin.include_role:
    name: redhatci.ocp.redhat_tests
  when: false

- name: "Remove origin-tests image"
  containers.podman.podman_image:
    name: "quay.io/openshift/origin-tests"
    state: absent
  ignore_errors: true

- name: Run cnf tests
  ansible.builtin.include_tasks: cnf-tests-run.yml
  when:
    - cnf_test_suites is defined
    - cnf_test_suites | length

- name: Run eco-gotests
  vars:
    eco_gotests_test_suites: "{{ eco_test_suites }}"
    eco_gotests_registry_auth_file: "{{ dci_pullsecret_file }}"
    eco_gotests_log_dir: "{{ job_logs.path }}"
    eco_gotests_kubeconfig_dir: "{{ dci_cluster_configs_dir }}"
  ansible.builtin.include_role:
    name: redhatci.ocp.eco_gotests
  when:
    - eco_test_suites is defined
    - eco_test_suites | length

- name: Run OpenShift conformance tests
  ansible.builtin.include_role:
      name: redhatci.ocp.ocp_conformance
  vars:
      oc_kubeconfig: "{{ kubeconfig_path }}"
      oc_version: "v{{ ocp_version_short }}"
      oc_registry: "{{ dci_local_registry }}"
      oc_mirror_org: "conformance-{{ ocp_version_maj ~ ocp_version_min }}"
      oc_registry_auth: "{{ dci_pullsecret_file }}"
      oc_log_dir: "{{ job_logs.path }}"
      # TODO: registry_certificate should be dci_registry_certificate to follow
      # agent vars name convention. Also referenced in docs/gitops-ztp.md
      oc_ca_cert: "{{ registry_certificate | default('') }}"
      # Legacy var in group_vars/all: dci_openshift_agent_conformance: ''
      oc_suite: "{{ dci_openshift_agent_conformance }}"
      # TODO: Document these 2 new vars:
      oc_extra_volumes: "{{ dci_conformance_extra_volumes | default([]) }}"
      oc_extra_env: "{{ dci_conformance_extra_env | default({}) }}"
  when:
    - dci_openshift_agent_conformance | length

- name: Run cluster-compare
  vars:
    cc_infra_type: "{{ dci_infra_type | default('core') }}"
    cc_reports_dir: "{{ job_logs.path }}"
  ansible.builtin.include_role:
    name: redhatci.ocp.cluster_compare
  when:
    - dci_cluster_compare | default(false) | bool
...
